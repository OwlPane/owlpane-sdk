# One GHCR image per SDK example; single GitOps tag pins all (values-hetzner.yaml imageTag).
name: Publish SDK example images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["sdk-v*"]
    paths:
      - "examples/**"
      - "packages/go/**"
      - ".github/workflows/publish-sdk-examples.yml"

env:
  REGISTRY: ghcr.io
  GIT_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_USERNAME: github-actions[bot]
  HELM_HETZNER: helm-charts/owlpane-sdk-examples/values-hetzner.yaml

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: |
          VERSION="$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: node
            dockerfile: examples/docker/apps/node.Dockerfile
          - id: go
            dockerfile: examples/docker/apps/go.Dockerfile
          - id: python
            dockerfile: examples/docker/apps/python.Dockerfile
          - id: java
            dockerfile: examples/docker/apps/java.Dockerfile
          - id: ruby
            dockerfile: examples/docker/apps/ruby.Dockerfile
          - id: browser
            dockerfile: examples/docker/apps/browser.Dockerfile
          - id: demo-server
            dockerfile: examples/docker/apps/demo-server.Dockerfile
          - id: pii-canary
            dockerfile: examples/docker/apps/pii-canary.Dockerfile
          - id: rust
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=rust
          - id: php
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=php
          - id: dotnet
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=dotnet
          - id: react-native
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=react-native
          - id: serverless
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=serverless
    steps:
      - uses: actions/checkout@v4
      - name: GHCR owner (lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sdk-example-${{ matrix.id }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_arg }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sdk-example-${{ matrix.id }}:${{ needs.meta.outputs.version }}
          build-args: |
            ${{ matrix.build_arg }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

  gitops:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Checkout seo-infra
        id: checkout_infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: balaji-singh/seo-infra
          path: seo-infra
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1
      - name: Pin imageTag for all examples
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          yq -i ".imageTag = \"${{ needs.meta.outputs.version }}\"" "${{ env.HELM_HETZNER }}"
      - name: Commit and push seo-infra
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          git config user.email "${{ env.GIT_EMAIL }}"
          git config user.name "${{ env.GIT_USERNAME }}"
          git add "${{ env.HELM_HETZNER }}"
          git diff --staged --quiet || \
            (git commit -m "chore(sdk-examples): imageTag ${{ needs.meta.outputs.version }}" && git push)
      - name: Skip GitOps sync (missing GIT_TOKEN)
        if: steps.checkout_infra.outcome != 'success'
        run: echo "::warning::GIT_TOKEN missing — bump imageTag in ${{ env.HELM_HETZNER }} manually"
