# One GHCR image per SDK example; single GitOps tag pins all (values-hetzner.yaml imageTag).
# Rebuild after example-only changes: Actions → Publish SDK example images → Run workflow (main).
name: Publish SDK example images

on:
  workflow_dispatch:
  # After sdk-v* publish (registries have the version). Avoid racing Publish SDK on every examples/** merge.
  workflow_run:
    workflows: ["Publish SDK"]
    types: [completed]

env:
  REGISTRY: ghcr.io
  GIT_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_USERNAME: github-actions[bot]
  HELM_HETZNER: helm-charts/owlpane-sdk-examples/values-hetzner.yaml

permissions:
  contents: read
  packages: write

# gitops job pushes seo-infra when GIT_TOKEN is set

jobs:
  meta:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: meta
        run: |
          SDK_VERSION="$(tr -d ' \n\r' < examples/sdk-published.version)"
          SHA="$(git rev-parse HEAD)"
          VERSION="$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}-$(echo "$SHA" | cut -c1-7)"
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Waiting for published SDK ${SDK_VERSION} on npm and PyPI..."
            for i in $(seq 1 36); do
              npm view "@owlpane/node@${SDK_VERSION}" version >/dev/null 2>&1 || { sleep 10; continue; }
              curl -fsSL "https://pypi.org/pypi/owlpane/json" | grep -q "\"${SDK_VERSION}\"" || { sleep 10; continue; }
              echo "Registries ready after ${i} attempt(s)"
              exit 0
            done
            echo "::warning::Registries may still be propagating; builds might retry manually"
          fi

  build:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: node
            dockerfile: examples/docker/apps/node.Dockerfile
          - id: go
            dockerfile: examples/docker/apps/go.Dockerfile
          - id: python
            dockerfile: examples/docker/apps/python.Dockerfile
          - id: java
            dockerfile: examples/docker/apps/java.Dockerfile
          - id: ruby
            dockerfile: examples/docker/apps/ruby.Dockerfile
          - id: browser
            dockerfile: examples/docker/apps/browser.Dockerfile
          - id: demo-server
            dockerfile: examples/docker/apps/demo-server.Dockerfile
          - id: pii-canary
            dockerfile: examples/docker/apps/pii-canary.Dockerfile
          - id: rust
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=rust
          - id: php
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=php
          - id: dotnet
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=dotnet
          - id: react-native
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=react-native
          - id: serverless
            dockerfile: examples/docker/apps/emitter.Dockerfile
            build_arg: APP_ID=serverless
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: GHCR owner (lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push sdk-example-${{ matrix.id }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/sdk-example-${{ matrix.id }}:${{ needs.meta.outputs.version }}
          build-args: |
            SDK_VERSION=${{ needs.meta.outputs.sdk_version }}
            ${{ matrix.build_arg }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}

  gitops:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Checkout seo-infra
        id: checkout_infra
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: balaji-singh/seo-infra
          path: seo-infra
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 1
      - name: Pin imageTag for all examples
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          yq -i ".imageTag = \"${{ needs.meta.outputs.version }}\"" "${{ env.HELM_HETZNER }}"
      - name: Commit and push seo-infra
        if: steps.checkout_infra.outcome == 'success'
        working-directory: seo-infra
        run: |
          git config user.email "${{ env.GIT_EMAIL }}"
          git config user.name "${{ env.GIT_USERNAME }}"
          git add "${{ env.HELM_HETZNER }}"
          git diff --staged --quiet || \
            (git commit -m "chore(sdk-examples): imageTag ${{ needs.meta.outputs.version }}" && git push)
      - name: Skip GitOps sync (missing GIT_TOKEN)
        if: steps.checkout_infra.outcome != 'success'
        run: echo "::warning::GIT_TOKEN missing — bump imageTag in ${{ env.HELM_HETZNER }} manually"
