name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: npm ci
      - run: npm run codegen
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: git diff --exit-code packages/go/owlpane/zz_generated_env.go packages/python/owlpane/_generated_config.py schema/install-snippets.json
      - run: node scripts/verify-versions.mjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: false }
      - run: mvn -q -f packages/java/pom.xml test
      - run: ruby -e "require './packages/ruby/lib/owlpane'; abort unless Owlpane::VERSION"
      - run: npm test
      - run: npm run build
      - name: Validate k8s example config
        run: |
          chmod +x examples/scripts/validate-k8s-config.sh
          examples/scripts/validate-k8s-config.sh
