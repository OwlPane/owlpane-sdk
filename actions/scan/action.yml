name: Owlpane report
description: Send security scan results, test results, coverage or a pipeline run to Owlpane.
inputs:
  ingest-key:
    description: Write-only Owlpane ingest key (store it as a secret).
    required: true
  ingest-url:
    description: Your Owlpane ingest endpoint (OTLP), used for tests, coverage and pipeline runs.
    required: false
  api-url:
    description: Your Owlpane API endpoint, used for security findings.
    required: false
  findings-format:
    description: sarif, trivy, gitleaks, osv or cyclonedx. Leave empty to skip.
    required: false
  findings-file:
    description: Path to the scanner report.
    required: false
  complete:
    description: "true = findings this scan no longer reports are marked fixed."
    required: false
    default: "true"
  junit:
    description: Path to a JUnit XML file. Leave empty to skip.
    required: false
  coverage-format:
    description: lcov, cobertura or json-summary. Leave empty to skip.
    required: false
  coverage-file:
    description: Path to the coverage report.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Send to Owlpane
      shell: bash
      env:
        OWLPANE_INGEST_KEY: ${{ inputs.ingest-key }}
        OWLPANE_INGEST_URL: ${{ inputs.ingest-url }}
        OWLPANE_API_URL: ${{ inputs.api-url }}
      run: |
        CLI="node ${{ github.action_path }}/../../packages/cli/bin/owlpane.mjs"
        if [ -n "${{ inputs.findings-format }}" ] && [ -n "${{ inputs.findings-file }}" ]; then
          $CLI findings import "${{ inputs.findings-format }}" "${{ inputs.findings-file }}" $([ "${{ inputs.complete }}" = "true" ] && echo --complete)
        fi
        if [ -n "${{ inputs.junit }}" ]; then $CLI test import junit "${{ inputs.junit }}"; fi
        if [ -n "${{ inputs.coverage-format }}" ] && [ -n "${{ inputs.coverage-file }}" ]; then
          $CLI coverage import "${{ inputs.coverage-format }}" "${{ inputs.coverage-file }}"
        fi
